  #   p: 0.25
  #   var_limit: 50
  # colorjitter:
  #   p: 0.2
  #   scale_setting: 0.25
  #   scale_color: 0.1
  # superpixels:
  #   p: 0.1
  # zoomblur:
  #   p: 0.1

  loss:
  nuclei_binary_map:
    focaltverskyloss:
      loss_fn: FocalTverskyLoss
      weight: 1
    dice:
      loss_fn: dice_loss
      weight: 1
  hv_map:
    mse:
      loss_fn: mse_loss_maps
      weight: 2.5
    msge:
      loss_fn: msge_loss_maps
      weight: 8
