sweep:
  method: bayes
  name: experimental_sweep
  metric:
    goal: maximize
    name: AUROC/Validation
  run_cap: 2


random_seed: 19

gpu: 0

data:
  dataset: PanNuke #SegmentationDataset
  dataset_path: /rsrch5/home/trans_mol_path/cercan/BE_master/2.intermediate/2.1.nucleus/training/qp_proj/finetune_anns/
  normalize_stains_train: false
  normalize_stains_val: false
  num_nuclei_classes: 2
  num_tissue_classes: 0
  train_filelist: /rsrch5/home/trans_mol_path/cercan/BE_master/2.intermediate/2.1.nucleus/training/qp_proj/finetune_anns/splits/train.csv
  val_filelist: /rsrch5/home/trans_mol_path/cercan/BE_master/2.intermediate/2.1.nucleus/training/qp_proj/finetune_anns/splits/val.csv
  test_filelist: /rsrch5/home/trans_mol_path/cercan/BE_master/2.intermediate/2.1.nucleus/training/qp_proj/finetune_anns/splits/test.csv
  label_map:
    0: "background"
    1: "nucleus"
  input_shape: 256
  
dataset_config:
  nuclei_types:
    background: 0
    nucleus: 1

model:
  pretrained_encoder: /rsrch5/home/trans_mol_path/cercan/code/CellViT-plus-plus/checkpoints/CellViT-256-x40-AMP.pth
  # cellvit_path: /rsrch5/home/trans_mol_path/cercan/code/CellViT-plus-plus/checkpoints/CellViT-256-x40-AMP.pth
  # pretrained: /rsrch5/home/trans_mol_path/cercan/code/CellViT-plus-plus/checkpoints/CellViT-256-x40-AMP.pth
  backbone: ViT256
  # parameters:
  #   hidden_dim:
  #     values: [128, 256, 512]
  # hidden_dim: 128

training:
  cache_cell_dataset: true
  batch_size: 8
  epochs: 200
  drop_rate: 0
  optimizer: AdamW
  unfreeze_epoch: 5
  sampling_gamma: 0.85
  sampling_strategy: cell
  optimizer_hyperparameter:
    betas: [0.85, 0.9]
    lr: 0.0001
    weight_decay: 0.0001 
    # parameters:
    #   lr:
    #     min: 0.00001
    #     max: 0.01
    #   weight_decay:
    #     min: 0.00001
    #     max: 0.001
  early_stopping_patience: 20
  scheduler:
    scheduler_type: constant
    # parameters:
    #   scheduler_type:
    #     values: [constant, exponential]
  mixed_precision: true
  eval_every: 1

transformations:
#   randomrotate90:
#     p: 0.5
#   horizontalflip:
#     p: 0.5
#   verticalflip:
#     p: 0.5
  # downscale:
  #   p: 0.15
  #   scale: 0.1
  # blur:
